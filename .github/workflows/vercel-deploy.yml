name: Deploy to Vercel (manual fallback)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  Deploy-Production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Refuse a superseded release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA" || { echo "A newer main commit exists; let Vercel deploy it from Git."; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Protected production secrets stay on Vercel. Its buildCommand runs the
      # read-only release gate before building/promoting; migrations are separate.
      - name: Build and deploy on Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
